[pytest]
testpaths = tests/extension
markers =
    invariant: read-only invariant guard tests (phase 3-A)
    replay: JSONL network replay tests (phase 3-B)
    loader: extension loader integration tests (phase 3-C)
    loads: phase 3-C E2E gate — service worker alive + popup renders version
    snapshot: selector snapshot tests (phase 3-D)
    live_emr: tests requiring live G-Hosp access (skipped by default)
    backend: Flask backend integration tests
    sw: service worker unit tests (Jest)
