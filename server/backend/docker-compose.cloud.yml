version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    ports:
      - "5050:5050"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tocafichadr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tocafichadr_dev}
      POSTGRES_DB: tocafichadr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-LINE", "pg_isready", "-U", "tocafichadr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
