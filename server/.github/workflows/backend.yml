name: Backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]

    defaults:
      run:
        working-directory: backend

    env:
      ALLOW_MISSING_OPENAI: "1"
      SECRET_KEY: test-secret
      DATABASE_URL: sqlite:////tmp/tocafichadr-ci.db
      CLERK_WEBHOOK_SECRET: whsec_test
      TOCAFICHADR_AUTH_REQUIRED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 via uv (self-hosted; avoids setup-python /Users/runner)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.11
          uv venv --seed --python 3.11 "$RUNNER_TEMP/pyvenv"
          echo "$RUNNER_TEMP/pyvenv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
