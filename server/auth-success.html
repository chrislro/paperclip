<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login concluído — Toca Ficha Dr.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #ddd;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 32px 28px;
      text-align: center;
    }
    .check {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
    }
    h1 { font-size: 18px; color: #fff; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 13px; color: #888; line-height: 1.5; margin-bottom: 18px; }
    .hint { font-size: 11px; color: #555; }
    button {
      margin-top: 8px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: linear-gradient(135deg, #10b981, #059669); }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Login concluído</h1>
    <p>Você está autenticado no Toca Ficha Dr. Pode fechar esta aba e voltar ao G-Hosp.</p>
    <button id="closeBtn">Fechar aba</button>
    <div class="hint" id="hint" style="margin-top:14px;"></div>
  </div>
  <script src="auth-success.js"></script>
</body>
</html>
