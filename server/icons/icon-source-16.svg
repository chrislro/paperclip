<!--
  Toca Ficha Dr. — 16px-optimized variant of the wave-to-tick mark.
  Fewer peaks, thicker stroke, tighter bounds — the full waveform from
  icon-source.svg blurs into mush at 16x16. This variant keeps three
  peaks + the dot tick so the silhouette is still recognizable in the
  Chrome toolbar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="3" fill="#0a0a0a"/>
  <path d="M 2 8.5 L 4 8.5 L 5 5 L 7 12 L 9 4 L 11 9 L 13 8.5"
        fill="none" stroke="#10b981" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="13" cy="8.5" r="1" fill="#10b981"/>
</svg>
